# Linux release assets for the fork: the app integration tests need a runnable
# elektrond, and the upstream release only ships Windows builds.
#
# static  - built through depends, no shared libraries, runs on any x86_64 Linux
# dynamic - built against the runner's libraries, quick, needs libevent/sqlite
#
# The upgrade tests also need an old build: dispatch with ref=v4.0.5 and the
# asset name keeps that version, the app CI picks it up as ELEKTROND_BIN_OLD.
name: release-linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the asset to (created when missing)"
        required: true
        default: "node-linux-ci"
      ref:
        description: "Git ref to build (branch, tag or commit); empty uses the dispatching ref"
        required: false
        default: ""
      variant:
        description: "How to link the node"
        type: choice
        options: [static, dynamic]
        default: static
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 curl bison \
            libtool autotools-dev automake

      - name: Extract version
        id: version
        run: |
          MAJOR=$(grep -m1 'set(CLIENT_VERSION_MAJOR' CMakeLists.txt | grep -o '[0-9]*')
          MINOR=$(grep -m1 'set(CLIENT_VERSION_MINOR' CMakeLists.txt | grep -o '[0-9]*')
          BUILD=$(grep -m1 'set(CLIENT_VERSION_BUILD' CMakeLists.txt | grep -o '[0-9]*')
          RC=$(grep -m1 'set(CLIENT_VERSION_RC' CMakeLists.txt | grep -o '[0-9]*')
          IS_RELEASE=$(grep -m1 'set(CLIENT_VERSION_IS_RELEASE' CMakeLists.txt | grep -o 'true\|false')
          if [ "$IS_RELEASE" = "false" ] && [ "$RC" != "0" ]; then
            VERSION="v${MAJOR}.${MINOR}.${BUILD}-rc${RC}"
          else
            VERSION="v${MAJOR}.${MINOR}.${BUILD}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Elektron Net ${VERSION}"

      # ── dynamic variant: build against the runner libraries ────────
      - name: Install runtime dependencies
        if: inputs.variant == 'dynamic'
        run: sudo apt-get install -y libboost-all-dev libevent-dev libsqlite3-dev

      - name: Configure (dynamic)
        if: inputs.variant == 'dynamic'
        run: |
          cmake -B build -G Ninja \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DENABLE_WALLET=ON \
            -DENABLE_IPC=OFF -DWITH_ZMQ=OFF \
            -DCMAKE_BUILD_TYPE=Release

      # ── static variant: depends toolchain ─────────────────────────
      - name: Cache depends
        if: inputs.variant != 'dynamic'
        uses: actions/cache@v4
        with:
          path: depends/built
          key: depends-linux64-${{ hashFiles('depends/**') }}
          restore-keys: depends-linux64-

      - name: Build depends
        if: inputs.variant != 'dynamic'
        run: |
          cd depends
          chmod +x config.guess config.sub gen_id || true
          make HOST=x86_64-pc-linux-gnu NO_QT=1 NO_ZMQ=1 NO_UPNP=1 NO_NATPMP=1 -j"$(nproc)"

      - name: Configure (static)
        if: inputs.variant != 'dynamic'
        run: |
          cmake -B build -G Ninja \
            --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake \
            -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DENABLE_WALLET=ON \
            -DENABLE_IPC=OFF -DWITH_ZMQ=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)" --target elektrond elektron-cli

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SUFFIX=""
          if [ "${{ inputs.variant }}" != "dynamic" ]; then SUFFIX="-static"; fi
          NAME="elektron-net-linux-${VERSION}-x86_64${SUFFIX}"
          mkdir -p "dist/$NAME"
          for bin in elektrond elektron-cli; do
            found=$(find build -type f -name "$bin" -perm -u+x | head -1)
            echo "$bin -> $found"
            cp "$found" "dist/$NAME/"
            ldd "$found" || true
          done
          ./dist/$NAME/elektrond --version
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elektron-net-linux-${{ steps.version.outputs.version }}-${{ inputs.variant || 'tag' }}
          path: dist/elektron-net-linux-*-x86_64*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          overwrite_files: true
          files: dist/elektron-net-linux-*-x86_64*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
